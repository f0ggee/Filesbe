<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filesb — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#070a09; --panel:#000; --text:#e6fff5; --muted:#7fe3b6; --border:#114436;
      --primary:#18b77a; --primary-press:#0ea36a; --focus:#2dd4a7;
    }

    *,*::before,*::after{ box-sizing:border-box }

    html,body{
      height:100%; margin:0; background:var(--bg); color:var(--text);
      font-family:"Inter", system-ui, sans-serif;
    }

    .container{
      max-width:460px; margin:0 auto; padding:clamp(20px, 8vh, 64px) 16px;
    }

    .brand{
      text-align:center; margin-bottom:32px; font-weight:700;
      color:var(--primary); font-size:clamp(22px, 5vw, 26px);
    }

    .brand small{
      display:block; margin-top:10px; font-size:clamp(14px, 4vw, 16px);
      font-weight:400; color:var(--muted); opacity:.9;
    }

    .card{
      background:var(--panel); border:1px solid var(--border);
      border-radius:22px; padding:clamp(20px, 6vw, 36px) clamp(16px, 5vw, 28px);
      box-shadow:0 0 40px rgba(24,183,122,.15);
    }

    h1{
      text-align:center; color:var(--primary);
      font-size:clamp(26px, 7vw, 36px); margin:0 0 14px;
    }

    .sub{
      text-align:center; color:var(--muted);
      font-size:clamp(15px, 4vw, 18px); margin-bottom:32px;
    }

    .field{ margin-bottom:22px; }

    label{
      display:block; font-size:clamp(15px, 4vw, 17px);
      margin-bottom:8px; color:var(--text); font-weight:500;
    }

    .input-wrap{ position:relative; }

    .input{
      width:100%; padding:clamp(14px, 3.5vw, 18px);
      padding-right:80px; font-size:16px; border-radius:14px;
      border:1px solid var(--border); background:#0a1612;
      color:var(--text); outline:none; transition: all 0.2s;
    }

    .input:focus{
      border-color:var(--focus); box-shadow:0 0 0 3px rgba(45,212,167,.12);
    }

    .input.invalid{ border-color:#a33; }

    .toggle{
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:0; color:var(--muted);
      font-size:14px; cursor:pointer; font-weight:600; padding:5px;
    }

    .btn-primary{
      width:100%; padding:clamp(16px, 4vw, 20px);
      font-size:clamp(18px, 5vw, 20px); font-weight:700;
      border-radius:16px; border:none; background:var(--primary);
      color:#002116; cursor:pointer; transition: 0.2s;
    }

    .btn-primary:hover{ background:var(--primary-press); transform: translateY(-1px); }
    .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

    .create{ margin-top:24px; text-align:center; }
    .create button{
      background:#fff; color:#000; border:none; border-radius:12px;
      padding:10px 20px; font-size:16px; cursor:pointer; font-weight:600;
      transition: 0.2s;
    }
    .create button:hover { opacity: 0.9; }

    .message{
      margin-top:18px; padding:12px; border-radius:12px;
      text-align:center; font-weight:600; display:none; font-size:14px;
    }
    .message.error{ background:#2b0d0d; color:#ffb4b4; display:block; border: 1px solid #5c1a1a; }

    .footer{
      margin-top:34px; text-align:center; font-size:14px;
      color:var(--muted); opacity:0.6;
    }

    @media (max-width: 380px) {
      .card { border-radius: 16px; padding: 20px 14px; }
      .input { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">
    Filesb
    <small data-i18n="brandSub">Fast file sharing without extra steps</small>
  </div>

  <div class="card">
    <h1 data-i18n="h1">Sign in</h1>
    <p class="sub" data-i18n="sub">Continue to access your personal files</p>

    <form id="loginForm" action="/login/api" method="post" novalidate>
      <div class="field">
        <label for="email" data-i18n="emailLabel">Email</label>
        <input id="email" class="input" type="email" placeholder="name@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password" data-i18n="passLabel">Password</label>
        <div class="input-wrap">
          <input id="password" class="input" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="togglePwd" data-i18n="show">Show</button>
        </div>
      </div>

      <button id="submitBtn" type="submit" class="btn-primary" data-i18n="btnReady">Sign in</button>
      <div id="responseMessage" class="message" role="alert" aria-live="polite"></div>
    </form>

    <div class="create">
      <button id="registerBtn" type="button" data-i18n="create">Create account</button>
    </div>

    <div class="footer">© 2026 Filesb</div>
  </div>
</div>

<script>
  // ==== 1. Тексты интерфейса ====
  const uiTranslations = {
    en: {
      brandSub: "Fast file sharing without extra steps",
      h1: "Sign in",
      sub: "Continue to access your personal files",
      emailLabel: "Email",
      passLabel: "Password",
      show: "Show",
      hide: "Hide",
      create: "Create account",
      passPlaceholder: "Enter your password",
      btnLoading: "Signing in...",
      btnReady: "Sign in",
      emptyFields: "Please enter email and password",
      badEmail: "Please enter a valid email",
      defaultError: "Connection error",
      badRequest: "Invalid email or password",
      unauthorized: "Invalid email or password",
      forbidden: "Access denied",
      tooMany: "Too many attempts. Please try again later",
      serverError: "Server error. Please try again later"
    },
    ru: {
      brandSub: "Быстрый обмен файлами без лишних шагов",
      h1: "Вход",
      sub: "Войдите, чтобы получить доступ к своим файлам",
      emailLabel: "Эл. почта",
      passLabel: "Пароль",
      show: "Показать",
      hide: "Скрыть",
      create: "Создать аккаунт",
      passPlaceholder: "Введите пароль",
      btnLoading: "Вход...",
      btnReady: "Войти",
      emptyFields: "Введите почту и пароль",
      badEmail: "Введите корректную почту",
      defaultError: "Ошибка подключения",
      badRequest: "Неверная почта или пароль",
      unauthorized: "Неверная почта или пароль",
      forbidden: "Доступ запрещён",
      tooMany: "Слишком много попыток. Попробуйте позже",
      serverError: "Ошибка сервера. Попробуйте позже"
    }
  };

  // ==== 2. Перевод сообщений из поля error_message ====
  // Ключ — ровно та строка, которую отдаёт бэкенд (регистр и пробелы по краям не важны).
  // Если сообщения нет в словаре — показывается как есть.
  const backendErrors = {
    "data is invalid": {
      en: "Invalid email or password",
      ru: "Неверная почта или пароль"
    },
    "something went wrong": {
      en: "Server error. Please try again later",
      ru: "Ошибка сервера. Попробуйте позже"
    }
    // Добавляйте сюда свои сообщения, например:
    // "user not found": { en: "User not found", ru: "Пользователь не найден" },
  };

  const savedLang = (() => { try { return localStorage.getItem('userLanguage'); } catch { return null; } })();
  const currentLang = uiTranslations[savedLang] ? savedLang : 'en';
  const t = (key) => uiTranslations[currentLang][key] || uiTranslations.en[key] || key;

  function applyLanguage() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (uiTranslations[currentLang][key]) el.textContent = uiTranslations[currentLang][key];
    });
    document.getElementById('password').placeholder = t('passPlaceholder');
  }

  // Перевод error_message; если пусто — запасной текст по HTTP-статусу
  function translateBackendError(serverMsg, httpStatus) {
    const msg = (serverMsg || '').trim();
    if (msg) {
      const entry = backendErrors[msg.toLowerCase()];
      return (entry && entry[currentLang]) ? entry[currentLang] : msg;
    }
    return fallbackByStatus(httpStatus);
  }

  function fallbackByStatus(status) {
    if (status === 400) return t('badRequest');
    if (status === 401) return t('unauthorized');
    if (status === 403) return t('forbidden');
    if (status === 429) return t('tooMany');
    if (status >= 500)  return t('serverError');
    return t('defaultError');
  }

  // Является ли status_of_operation признаком ошибки
  function isErrorStatus(s) {
    if (!s) return false;
    return ['error', 'fail', 'failed', 'failure', 'false'].includes(String(s).trim().toLowerCase());
  }

  // ==== 3. Элементы ====
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const responseDiv = document.getElementById('responseMessage');
  const pwdInput = document.getElementById('password');
  const togglePwd = document.getElementById('togglePwd');
  const emailInput = document.getElementById('email');
  const registerBtn = document.getElementById('registerBtn');

  function showError(text) {
    responseDiv.className = 'message error';
    responseDiv.textContent = text;
    responseDiv.style.display = 'block';
  }

  function clearError() {
    responseDiv.className = 'message';
    responseDiv.textContent = '';
    responseDiv.style.display = 'none';
    emailInput.classList.remove('invalid');
    pwdInput.classList.remove('invalid');
  }

  togglePwd.onclick = () => {
    const isPwd = pwdInput.type === 'password';
    pwdInput.type = isPwd ? 'text' : 'password';
    togglePwd.textContent = isPwd ? t('hide') : t('show');
  };

  registerBtn.onclick = () => window.location.href = '/register';

  emailInput.addEventListener('input', () => emailInput.classList.remove('invalid'));
  pwdInput.addEventListener('input', () => pwdInput.classList.remove('invalid'));

  // ==== 4. Отправка формы ====
  form.onsubmit = async (e) => {
    e.preventDefault();
    clearError();

    const email = emailInput.value.trim();
    const password = pwdInput.value;

    // Клиентская проверка до запроса
    if (!email || !password) {
      if (!email) emailInput.classList.add('invalid');
      if (!password) pwdInput.classList.add('invalid');
      showError(t('emptyFields'));
      return;
    }
    if (!emailInput.checkValidity()) {
      emailInput.classList.add('invalid');
      showError(t('badEmail'));
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = t('btnLoading');

    try {
      const res = await fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      // Ответ бэкенда: { status_of_operation, url_to_redirect, error_message }
      let data = null;
      try { data = await res.json(); } catch { data = null; }

      const errorMessage = data && typeof data.error_message === 'string' ? data.error_message : '';
      const redirectUrl  = data && typeof data.url_to_redirect === 'string' ? data.url_to_redirect.trim() : '';
      const opStatus     = data ? data.status_of_operation : '';

      // Успех: HTTP 2xx, нет error_message и статус операции не "ошибка"
      if (res.ok && !errorMessage.trim() && !isErrorStatus(opStatus)) {
        window.location.href = redirectUrl || '/main';
        return; // кнопку не разблокируем — идёт переход
      }

      // Любая ошибка: показываем error_message (переведённый) или текст по статусу
      if (res.status === 400 || res.status === 401) {
        emailInput.classList.add('invalid');
        pwdInput.classList.add('invalid');
      }
      showError(translateBackendError(errorMessage, res.ok ? 0 : res.status));
    } catch (err) {
      // Сеть недоступна / CORS / сервер не ответил
      showError(t('defaultError'));
    }

    submitBtn.disabled = false;
    submitBtn.textContent = t('btnReady');
  };

  applyLanguage();
</script>

</body>
</html>
